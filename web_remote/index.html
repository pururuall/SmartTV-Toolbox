<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Smart TV Remote</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d2d;
      --card-border: #243247;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: #1e293b;
      --btn-active: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 30px;
    }

    .remote-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
    }

    .brand-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .btn-power {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--danger);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-power:active { background: var(--danger); color: #fff; }

    /* D-PAD */
    .dpad-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 8px auto;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.05);
      touch-action: manipulation;
    }

    .dpad-btn {
      position: absolute;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }

    .dpad-btn:active {
      color: var(--accent);
      transform: scale(0.92);
    }

    .dpad-up { top: 12px; left: 50%; transform: translateX(-50%); width: 70px; height: 60px; }
    .dpad-down { bottom: 12px; left: 50%; transform: translateX(-50%); width: 70px; height: 60px; }
    .dpad-left { left: 12px; top: 50%; transform: translateY(-50%); width: 60px; height: 70px; }
    .dpad-right { right: 12px; top: 50%; transform: translateY(-50%); width: 60px; height: 70px; }

    .dpad-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      background: var(--btn-bg);
      border: 2px solid var(--card-border);
      border-radius: 50%;
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .dpad-center:active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      transform: translate(-50%, -50%) scale(0.94);
    }

    /* Main Action Row */
    .btn-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .remote-btn {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      height: 52px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transition: all 0.1s;
    }

    .remote-btn:active {
      background: var(--btn-active);
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(0.96);
    }

    /* Volume & Media Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    /* HDMI Switcher Row */
    .section-title {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 4px 0 2px 4px;
      font-weight: 700;
    }

    .hdmi-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hdmi-btn {
      background: #141c2b;
      border: 1px solid var(--card-border);
      color: var(--text);
      height: 40px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .hdmi-btn:active {
      background: var(--accent);
      color: #000;
    }

    /* Quick Apps */
    .apps-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .app-shortcut-btn {
      background: #141c2b;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 0.74rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .app-shortcut-btn:active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Text Input Box */
    .input-box {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .input-field {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--accent);
    }

    .btn-send-text {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn-send-text:active {
      background: var(--accent-hover);
    }

    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--text-muted);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
  </style>
</head>
<body>

  <div class="remote-container">
    
    <!-- Top Header -->
    <div class="top-bar">
      <div class="brand-title">
        <div class="status-dot"></div>
        <span>Smart TV Web Remote</span>
      </div>
      <button class="btn-power" onclick="sendKey(26)" title="Питание">⏻</button>
    </div>

    <!-- D-Pad Controller -->
    <div class="dpad-wrapper">
      <button class="dpad-btn dpad-up" onclick="sendKey(19)" aria-label="Вверх">▲</button>
      <button class="dpad-btn dpad-left" onclick="sendKey(21)" aria-label="Влево">◀</button>
      <button class="dpad-center" onclick="sendKey(23)" aria-label="OK">OK</button>
      <button class="dpad-btn dpad-right" onclick="sendKey(22)" aria-label="Вправо">▶</button>
      <button class="dpad-btn dpad-down" onclick="sendKey(20)" aria-label="Вниз">▼</button>
    </div>

    <!-- Navigation Buttons -->
    <div class="btn-row">
      <button class="remote-btn" onclick="sendKey(4)">
        <span>↩</span> <span>Назад</span>
      </button>
      <button class="remote-btn" onclick="sendKey(3)">
        <span>⌂</span> <span>Домой</span>
      </button>
      <button class="remote-btn" onclick="sendKey(82)">
        <span>☰</span> <span>Меню</span>
      </button>
    </div>

    <!-- Volume & Media Controls -->
    <div class="controls-grid">
      <button class="remote-btn" onclick="sendKey(25)">
        <span>🔉</span> <span>-</span>
      </button>
      <button class="remote-btn" onclick="sendKey(164)">
        <span>🔇</span>
      </button>
      <button class="remote-btn" onclick="sendKey(24)">
        <span>🔊</span> <span>+</span>
      </button>
    </div>

    <!-- HDMI Inputs -->
    <div>
      <div class="section-title">Входы HDMI</div>
      <div class="hdmi-group">
        <button class="hdmi-btn" onclick="sendKey(243)">HDMI 1</button>
        <button class="hdmi-btn" onclick="sendKey(244)">HDMI 2</button>
        <button class="hdmi-btn" onclick="sendKey(245)">HDMI 3</button>
      </div>
    </div>

    <!-- Quick Apps Launcher -->
    <div>
      <div class="section-title">Быстрый запуск</div>
      <div class="apps-group">
        <button class="app-shortcut-btn" onclick="launchApp('mobi.zona')">Zona</button>
        <button class="app-shortcut-btn" onclick="launchApp('com.falcofemoralis.hdrezkaapp')">HDRezka</button>
        <button class="app-shortcut-btn" onclick="launchApp('ru.twicker.lampa')">LAMPA</button>
        <button class="app-shortcut-btn" onclick="launchApp('com.alphainventor.filemanager')">Файлы</button>
      </div>
    </div>

    <!-- Keyboard Typing -->
    <div>
      <div class="section-title">Ввод текста с клавиатуры</div>
      <div class="input-box">
        <input type="text" id="textInput" class="input-field" placeholder="Поиск фильма, ссылка..." onkeydown="if(event.key==='Enter') sendText()">
        <button class="btn-send-text" onclick="sendText()">Отправить</button>
      </div>
    </div>

  </div>

  <div id="toast" class="toast">Команда отправлена</div>

  <script>
    function vibrate() {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(25);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.opacity = '1';
      setTimeout(() => { t.style.opacity = '0'; }, 1000);
    }

    async function sendKey(code) {
      vibrate();
      try {
        await fetch(`/cgi-bin/key?c=${code}`);
      } catch (e) {}
    }

    async function launchApp(pkg) {
      vibrate();
      showToast('Запуск приложения...');
      try {
        await fetch(`/cgi-bin/app?pkg=${pkg}`);
      } catch (e) {}
    }

    async function sendText() {
      const inp = document.getElementById('textInput');
      const text = inp.value.trim();
      if (!text) return;
      vibrate();
      inp.value = '';
      showToast('Отправка текста...');
      try {
        await fetch(`/cgi-bin/text?t=${encodeURIComponent(text)}`);
      } catch (e) {}
    }
  </script>
</body>
</html>
